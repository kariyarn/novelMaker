# 테스트 + 앱 만들기: main 에 올리거나 PR 을 열면 자동으로, 또는 Actions 탭에서 직접 (Run workflow)
# 다 만들어지면 Actions → 해당 실행 → Artifacts 에서 받기
# main 에 올리면 설치 파일을 Releases 에도 올림 (README 맨 위 링크가 늘 최신 파일을 가리킴)
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
defaults:
  run:
    working-directory: storyline-app
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: storyline-app/package-lock.json}
      - run: npm ci
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: 1}
      - run: npm test
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: storyline-app/package-lock.json}
      - run: npm ci
      - run: npm version --no-git-tag-version --allow-same-version "1.0.${{ github.run_number }}"      # 앱 자동 업데이트가 비교하는 버전 (1.0.<빌드 번호>)
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: storyline-app/dist/*.exe
          if-no-files-found: error
  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: storyline-app/package-lock.json}
      - run: npm ci
      - run: test -d node_modules/electron/dist/Electron.app || node node_modules/electron/install.js
      - run: npm version --no-git-tag-version --allow-same-version "1.0.${{ github.run_number }}"
      - run: zsh build.sh      # electron-builder 맥 앱은 켜자마자 죽어서 순정 Electron.app 에 코드를 넣는 방식
      - run: ditto -c -k --keepParent "dist/캐릭터 스토리라인.app" dist/storyline-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: storyline-app/dist/storyline-mac-arm64.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    defaults:
      run: {working-directory: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: 앱 코드 묶음 만들기 (설치된 앱이 이걸 받아서 스스로 업데이트)
        working-directory: storyline-app
        run: |
          npm version --no-git-tag-version --allow-same-version "1.0.${{ github.run_number }}"
          node tools/pack-code.js
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: 릴리스에 올리기
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" out/storyline-windows-setup.exe out/storyline-mac-arm64.zip storyline-app/dist/app-code.json.gz \
            --target "${{ github.sha }}" --title "캐릭터 스토리라인 ($(date -u +%Y-%m-%d) · ${tag})" \
            --notes "main 의 최신 코드로 자동으로 만든 설치 파일이에요. Windows 는 .exe, 맥(Apple 칩)은 .zip 을 받아요. 이미 설치한 앱은 app-code.json.gz 를 받아 스스로 업데이트해요." --latest
          # 오래된 자동 릴리스는 최근 5개만 남김
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 | while read t; do gh release delete "$t" --yes --cleanup-tag; done
