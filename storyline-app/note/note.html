<!doctype html>
<html lang="ko" spellcheck="false">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>메모</title>
<style>
:root{--bg:#fff1a6;--ink:#2b2a26;--muted:rgba(43,42,38,.55);--line:rgba(43,42,38,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
.note{position:absolute;inset:6px;display:flex;flex-direction:column;background:var(--bg);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.12);overflow:hidden;transition:background .2s}
.bar{display:flex;align-items:center;gap:2px;padding:4px 6px 2px 8px;-webkit-app-region:drag;user-select:none;min-height:30px}
.bar button,.bar .kind{-webkit-app-region:no-drag}
button svg{display:block}
button{font:inherit;color:var(--muted);background:none;border:0;border-radius:6px;padding:2px 6px;cursor:pointer;line-height:1.4}
button:hover{background:var(--line);color:var(--ink)}
button.on{color:var(--ink);background:var(--line)}
button:disabled{opacity:.3;cursor:default;background:none}
.pos{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.kind{font-size:12px}
.sp{flex:1}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:15px;line-height:1.65;padding:4px 14px 8px}
textarea::placeholder{color:var(--muted)}
.foot{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:8px;padding:2px 12px 6px;font-size:11px;color:var(--muted);user-select:none}
.st{transition:opacity .3s}
</style>
</head>
<body>
<div class="note" id="note">
  <div class="bar">
    <button id="prev" title="이전 포스트잇 (Alt+←)">‹</button><span class="pos" id="pos">새 글</span><button id="next" title="다음 포스트잇 (Alt+→)">›</button>
    <button class="kind" id="kind" title="분류 바꾸기"></button>
    <span class="sp"></span>
    <button id="op" title="투명도 (누를 때마다 옅게)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <button id="top" title="항상 위에 두기"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></svg></button>
    <button id="main" title="큰 창 열기"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
    <button id="hide" title="숨기기 (Esc)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/></svg></button>
  </div>
  <textarea id="ta" placeholder="떠오른 걸 적어요"></textarea>
  <div class="foot"><span id="hint"></span><span class="sp"></span><span class="st" id="st"></span></div>
</div>
<script src="note.js"></script>
</body>
</html>
