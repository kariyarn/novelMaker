<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b98a"/><stop offset="1" stop-color="#b98d58"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.6" fill="#8a6234" opacity=".28"/><circle cx="16" cy="15" r="1.2" fill="#fff" opacity=".18"/></pattern>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
<radialGradient id="pin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a80"/><stop offset=".45" stop-color="#e5372b"/><stop offset="1" stop-color="#8f140d"/></radialGradient>
<radialGradient id="pin2" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8fc3ff"/><stop offset=".45" stop-color="#2d7ff0"/><stop offset="1" stop-color="#123f86"/></radialGradient>
<clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
</defs>
<g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
<g clip-path="url(#sq)"><rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="6"/></g>
<!-- note 1 -->
<g transform="rotate(-8 360 470)" filter="url(#sh2)"><rect x="210" y="300" width="300" height="320" rx="14" fill="#ffef9a"/>
<rect x="250" y="400" width="210" height="16" rx="8" fill="#b89a2c" opacity=".45"/><rect x="250" y="440" width="170" height="16" rx="8" fill="#b89a2c" opacity=".45"/><rect x="250" y="480" width="190" height="16" rx="8" fill="#b89a2c" opacity=".45"/></g>
<!-- note 2 -->
<g transform="rotate(7 660 600)" filter="url(#sh2)"><rect x="515" y="450" width="300" height="320" rx="14" fill="#bdeed5"/>
<rect x="555" y="560" width="210" height="16" rx="8" fill="#3c8a62" opacity=".42"/><rect x="555" y="600" width="150" height="16" rx="8" fill="#3c8a62" opacity=".42"/><rect x="555" y="640" width="185" height="16" rx="8" fill="#3c8a62" opacity=".42"/></g>
<!-- string -->
<path d="M372 318 C 470 420, 560 440, 650 470" stroke="#c8412b" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9"/>
<!-- pins -->
<g filter="url(#sh2)"><circle cx="372" cy="318" r="38" fill="url(#pin)"/><ellipse cx="360" cy="304" rx="12" ry="8" fill="#fff" opacity=".55"/></g>
<g filter="url(#sh2)"><circle cx="652" cy="470" r="34" fill="url(#pin2)"/><ellipse cx="641" cy="457" rx="11" ry="7" fill="#fff" opacity=".55"/></g>
</svg>
