<div id="modal"><div class="box" id="mbox" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="pinHeadB" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#6a6a70"/><stop offset=".4" stop-color="#26262a"/><stop offset="1" stop-color="#050506"/></radialGradient>
<linearGradient id="pinBody" x1="0" x2="1"><stop offset="0" stop-color="#050505"/><stop offset=".32" stop-color="#55555b"/><stop offset=".6" stop-color="#1a1a1d"/><stop offset="1" stop-color="#030303"/></linearGradient>
<linearGradient id="pinMetal" x1="0" x2="1"><stop offset="0" stop-color="#8d939a"/><stop offset=".5" stop-color="#e6e9ec"/><stop offset="1" stop-color="#7d838a"/></linearGradient>
<radialGradient id="pinShadow"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs></svg>
